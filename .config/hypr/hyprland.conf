# ~/.config/hypr/hyprland.conf

source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

source = ~/.local/state/omarchy/toggles/hypr/*.conf

# Add any other personal Hyprland configuration below

# With the lid open, mirror the laptop panel to the Dell. When the lid closes,
# detach the Dell from the mirror before disabling the laptop panel so the Dell
# remains available as the only display.
unbind = , switch:on:Lid Switch
unbind = , switch:off:Lid Switch
bindl = , switch:on:Lid Switch, exec, omarchy-hw-external-monitors && hyprctl keyword monitor "HDMI-A-1,1920x1080@60,1536x0,1,mirror,none" && hyprctl keyword monitor "eDP-1,disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1,1920x1200@60,0x0,1.25,mirror,none" && hyprctl keyword monitor "HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1"

workspace=1,monitor:eDP-1
workspace=2,monitor:eDP-1
workspace=3,monitor:eDP-1
workspace=4,monitor:eDP-1
workspace=5,monitor:eDP-1
workspace=6,monitor:eDP-1
workspace=7,monitor:eDP-1

windowrule {
    name = steam-all
    match:class = ^steam.*$
    workspace = 1
    float = on
    center = on
}

windowrule {
    name = steam-title-fallback
    match:class = ^steam$
    match:title = ^(Steam|Updating|Working|Loading).*
    workspace = 1
    float = on
    center = on
}

windowrule {
    name = steam-signin
    match:initial_title = ^Sign in to Steam$
    workspace = 1
    float = on
    center = on
}

windowrule {
    name = dota2-main
    match:class = ^(steam_app_570|dota2)$
    workspace = 1
    fullscreen = on
    no_anim = on
    monitor = eDP-1
}

windowrule {
    name = ferdium
    match:class = ^Ferdium$
    workspace = 7
}

# ~/.config/hypr/monitors.conf

# Laptop panel. eDP-1 is the machine-specific replacement for the desktop's
# DP-1/HDMI-A-1 layout.

# monitor=eDP-1,1920x1200@60,0x0,1.25

# Optional location-specific presets. Enable one set only when needed.

# Classroom/projector mirror:
# monitor=eDP-1,1920x1080@60,0x0,1.25
# monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

# Sala 90 extended display:
# monitor=eDP-1,1920x1200@60,0x60,1.25
# monitor=HDMI-A-1,1920x1080@60,1536x0,1

# Sala 90 / Dell duplicate mirror:
# Keep the laptop panel as the source and mirror it to the 1080p Dell.
# The aspect ratios differ (16:10 laptop, 16:9 Dell), so slight scaling or
# letterboxing can occur on the external display.
monitor=eDP-1,1920x1200@60,0x0,1.25
monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

# Vivobem 4K mirror:
# monitor=eDP-1,1920x1080@60,0x0,1.25
# monitor=HDMI-A-1,3840x2160@60,0x0,1,mirror,eDP-1

# ~/.config/hypr/monitors.conf

# Laptop only.
monitor=eDP-1,1920x1200@60,0x0,1

# Sala 90
# Monitor only - laptop lid closed
# monitor=eDP-1,1920x1080@60,0x0,1

# Optional location-specific presets. Enable one set only when needed.

# Classroom/projector mirror:
# monitor=eDP-1,1920x1080@60,0x0,1.25
# monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

# Sala 90 extended display:
# monitor=eDP-1,1920x1200@60,0x60,1.25
# monitor=HDMI-A-1,1920x1080@60,1536x0,1

# Sala 90 duplicate/mirror:
# Both displays use 1920x1080 because the Sala 90 external display
# does not support the laptop panel's native 1920x1200 resolution.
# monitor=HDMI-A-1,1920x1080@60,0x0,1
# monitor=eDP-1,1920x1200@60,0x0,1.25,mirror,HDMI-A-1

# Vivobem 4K mirror:
# monitor=eDP-1,1920x1080@60,0x0,1.25
# monitor=HDMI-A-1,3840x2160@60,0x0,1,mirror,eDP-1
